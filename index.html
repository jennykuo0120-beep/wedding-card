<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞鵬 & 貞吟 婚禮邀請函</title>
  <link rel="stylesheet" href="style.css">
</head>
<script>
  document.addEventListener('click', function() {
    const audio = document.querySelector('.wedding-audio');
    if (audio && audio.paused) {
      audio.play();
    }
  }, { once: true });
</script>
  <body>
  <main class="invitation-card">
    <!-- 背景音樂區塊 -->
<div style="margin: 20px 0;">
  <audio controls autoplay loop class="wedding-audio">
    <source src="music.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放。
  </audio>
</div>
    <!-- 封面頂部與主圖 -->
    <header class="hero">
      <!-- 置中音樂播放器與自動播放觸發器 -->
<div style="text-align: center; margin: 25px 0;">
  <p style="font-size: 0.9em; color: #666; margin-bottom: 8px;">🎵 背景音樂</p>
  <audio controls autoplay loop class="wedding-audio" style="outline: none;">
    <source src="music.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放。
  </audio>
</div>

<!-- 點擊任意處自動播放音樂 -->
<script>
  document.addEventListener('click', function() {
    const audio = document.querySelector('.wedding-audio');
    if (audio && audio.paused) {
      audio.play();
    }
  }, { once: true });
</script>
      <p class="subtitle">WEDDING INVITATION</p>
      <h1>瑞鵬 & 貞吟</h1>
      <p class="date">2026 . 11 . 07</p>

      <!-- 主視覺封面照片 -->
      <div class="polaroid-frame">
        <img src="images/cover.jpg" alt="主視覺婚紗照" class="hero-img">
      </div>
    </header>

    <!-- 橫向輪播相簿區 -->
    <section class="section">
      <h2>精選相簿</h2>
      <p class="album-hint">‹ 左右滑動查看照片 ›</p>
      <div class="album-carousel">
        <img src="images/photo1.jpg" alt="婚紗照 1">
        <img src="images/photo2.jpg" alt="婚紗照 2">
        <img src="images/photo3.jpg" alt="婚紗照 3">
        <img src="images/photo4.jpg" alt="婚紗照 4">
        <img src="images/photo5.jpg" alt="婚紗照 5">
      </div>
    </section>

    <!-- 婚禮與婚宴資訊 -->
    <section class="section">
      <h2>婚宴資訊</h2>
      <p class="time"><strong>時間：</strong>2026 年 11 月 7 日 (六) 12:00</p>
      <p class="location"><strong>地點：</strong>捷絲旅 臺南虎山館 Good Time 鼓時光宴會廳</p>
      <p class="address">台南市仁德區文華路二段300號10樓</p>
    </section>

    <!-- Google 地圖導航 -->
    <section class="section">
      <h2>婚宴地點導航</h2>
      <div class="map-container">
        <iframe 
          src="https://maps.google.com/maps?q=台南市仁德區文華路二段300號&output=embed" 
          width="100%" 
          height="220" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy">
        </iframe>
      </div>
      <a class="btn btn-outline" href="https://maps.app.goo.gl/WFR496NyzEuJFRc66" target="_blank">開啟 Google 地圖導航</a>
    </section>
  </main>
</body>
</html>
